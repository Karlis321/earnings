name: refresh-data

# Universe-wide daily refresh. The permanent successor to the
# Vercel-Cron / /api/cron/daily route — invokes the standalone
# orchestrator at scripts/refresh-universe.mjs which composes today's
# battle-tested phase scripts (Yahoo timeseries, quoteSummary,
# earningsChart, mature-*, SEC-verbatim, estimator, reactions,
# market-cap batch, …). No Vercel 300s function cap; runs inside the
# job budget below.
#
# Scheduling:
#   03:00 UTC weekdays, 90 min BEFORE the /sweep workflow at 04:30
#   (which reads the shards this workflow just refreshed). Bumped
#   from 06:00 → 05:00 on 2026-08-03 and then to 03:00 UTC (05:00
#   Riga local, morning coffee) so summaries + fresh data are ready
#   before Karlis opens the dashboard.
#
# NOTE: The schedule line is COMMENTED OUT for the initial commit —
# GitHub Actions minutes may still be exhausted from a prior run.
# Cutover procedure (see TODO_TOMORROW.md):
#   1. Check Settings → Billing for the minutes-reset date.
#   2. When minutes are available: uncomment the `- cron: …` line.
#   3. First run manually via workflow_dispatch to verify.
#   4. Wait for TWO consecutive scheduled runs to land green.
#   5. THEN disable the Vercel cron trigger in frontend/vercel.json.
# The two-successes-before-cutover rule from the migration plan
# applies — do not shut off the Vercel path until this one has proven
# itself twice.

on:
  # Schedule enabled 2026-08-03 after: (a) repo made public →
  # unlimited GitHub Actions minutes, and (b) daily-refresh.yml
  # (the Vercel-invoking workflow) started hitting the 300s Vercel
  # Hobby function cap on slice 0 post-SP500 ingest. refresh-data
  # runs everything locally inside the Actions runner, no Vercel
  # 300s ceiling, no RSS fanout duplication across slices.
  schedule:
    - cron: "0 3 * * 1-5"
  workflow_dispatch:
    inputs:
      note:
        description: "Trigger source label (e.g. 'claude', 'manual test', 'cutover-verify-1'). Shown in the run title."
        required: false
        default: ""
      only:
        description: "Optional --only=<phase-key> passthrough (yahoo-shards / marketcap / …)."
        required: false
        default: ""
      dry_run:
        description: "If 'true', pass --dry-run to the orchestrator (no writes, no commit)."
        required: false
        default: "false"

run-name: >-
  refresh-data · ${{
    github.event_name == 'schedule' && 'scheduled (Mon–Fri 03:00 UTC)'
    || (github.event.inputs.note != '' && format('manual · {0}', github.event.inputs.note))
    || 'manual'
  }}${{ github.event.inputs.only != '' && format(' · only={0}', github.event.inputs.only) || '' }}${{ github.event.inputs.dry_run == 'true' && ' · dry-run' || '' }}

# cancel-in-progress: false — the phases mutate shards + registry; killing
# mid-run risks partial writes. Let the previous run finish before a
# concurrent trigger starts a new one.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 120 min = generous headroom for the full-universe path when
    # Yahoo latency spikes (yahoo-timeseries touches ~1,600 tickers at
    # concurrency 6, ~40 min on a bad day; earningsTrend adds another
    # ~15 min; SEC-verbatim per-CIK adds ~10 min at 1 req/s; total
    # steady-state ~70 min with slack).
    timeout-minutes: 120
    permissions:
      contents: write # required for the orchestrator's git push.
      actions: write # required to chain to claude-summarize.yml.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Fetch enough history so `git commit` doesn't refuse-shallow.
          fetch-depth: 2

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Configure git identity for the daily commit
        run: |
          git config user.name  "earnings-refresh-bot"
          git config user.email "earnings-refresh-bot@users.noreply.github.com"

      - name: Run refresh-universe orchestrator
        env:
          # Same secrets the Vercel cron route uses. Optional — the
          # phase scripts fall back cleanly when absent (FMP-optional,
          # LLM-optional, etc.).
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          # SEC EDGAR fair-access — real contact email. Historical bug
          # was hardcoded example.com in some scripts; fixed 2026-08-05.
          EDGAR_CONTACT_EMAIL: ${{ vars.EDGAR_CONTACT_EMAIL || 'klpp@bluorbank.lv' }}
          # Bump Node heap to 8 GB. sec-verbatim (rederive-sec-xbrl)
          # accumulates ~1,200 companies × ~7 events × shard objects
          # plus a per-CIK factsCache; the default 4 GB heap OOMs at
          # ~800 companies with "Reached heap limit Allocation failed".
          # This is the real root cause of every refresh-data failure
          # today — SEC UA email was a red herring. Ubuntu GitHub runners
          # have 16 GB RAM, so 8 GB is safe headroom.
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          set -euo pipefail
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run --no-commit"
          fi
          if [ -n "${{ github.event.inputs.only }}" ]; then
            FLAGS="$FLAGS --only=${{ github.event.inputs.only }}"
          fi
          echo "orchestrator flags: $FLAGS"
          node scripts/refresh-universe.mjs $FLAGS

      - name: Push the daily commit
        # Run even when the orchestrator exited 1 — a standing-tests
        # failure (data-quality signal) shouldn't prevent publishing 22
        # of 23 phases of legitimate refresh work. `if: always()` combined
        # with the dry-run gate means: push if there's a commit, unless
        # the operator asked for a dry-run.
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          # The orchestrator already created the commit; we push here
          # so an auth failure is visible as its own workflow step. If
          # the orchestrator found no changes (weekend + nothing
          # ingested), `git push` is a no-op.
          if ! git log -1 --pretty=%s | grep -q "^daily refresh:"; then
            echo "no daily-refresh commit to push (nothing changed)"
            exit 0
          fi
          # Rebase onto origin/main before push. Multi-hour orchestrator
          # runs commonly collide with /sweep or manual commits that
          # landed while we were working; without rebase the push fails
          # non-fast-forward and 22 phases of refresh work get dropped.
          # If rebase hits a conflict, prefer OURS (this fresh refresh
          # is more authoritative than whatever raced in on the same
          # data files) — merge markers would break shard JSON parsing
          # on Vercel.
          git fetch origin main
          if ! git rebase -X ours origin/main; then
            echo "::warning::rebase conflict on daily refresh — aborting rebase"
            git rebase --abort || true
            echo "::error::could not rebase onto origin/main; skipping push"
            exit 1
          fi
          git push

      - name: Chain to claude-summarize (fetch fresh Q reports)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # After the data pipeline commits, fire the claude-summarize
          # workflow so Claude runs /sweep against the fresh state.
          # /sweep now covers Tier A (covered.json) ∪ Tier B (SP500
          # US-primary domestic) — Claude produces per-ticker earnings
          # summaries for anything that reported in the last 5 trading
          # days without a summary yet.
          #
          # Uses GITHUB_TOKEN with workflow: write. Fires-and-forgets;
          # claude-summarize runs to completion in its own workflow
          # (30-min budget) and posts summaries + push independently.
          echo "Chaining to claude-summarize.yml for /sweep …"
          gh workflow run claude-summarize.yml \
            --repo "${{ github.repository }}" \
            --field note="chained-from-refresh-data" \
            || echo "::warning::failed to chain claude-summarize (non-fatal)"
