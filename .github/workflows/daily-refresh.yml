name: daily-refresh

# Vercel Hobby-tier cron is best-effort — it can skip runs under
# load or plan-based rate limits with no retry. This workflow pings
# /api/cron/daily from GitHub Actions instead, which has a much
# tighter reliability profile (~5 min drift, guaranteed execution
# for public + private repos on free-tier).
#
# Schedule: 06:00 UTC Mon-Fri (same slot as the Vercel Cron config
# in frontend/vercel.json). Vercel Cron stays enabled as a
# secondary trigger — the daily route is idempotent (if it fires
# twice in a short window the second run finds no new work and
# writes an empty cron-status).
#
# Also triggerable manually via workflow_dispatch when the banner
# says "Daily refresh hasn't run in over 24 hours".
#
# Requires repo secret CRON_SECRET (same value as Vercel env var).

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:
    inputs:
      note:
        description: "Trigger source label (e.g. 'claude', 'manual test', 'rate-limit retry'). Shown in the run title."
        required: false
        default: ""

# run-name — what appears in the Actions tab list. Distinguishes
# scheduled runs from manual triggers and tags manual triggers with
# the reason so `claude ...`, `manual test`, etc. are readable at a
# glance. See github.com/actions/runner/issues/2033 for run-name syntax.
run-name: >-
  daily-refresh · ${{
    github.event_name == 'schedule' && 'scheduled (06:00 UTC)'
    || (github.event.inputs.note != '' && format('manual · {0}', github.event.inputs.note))
    || 'manual'
  }}

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 25 min = 8 slices × ~60-90s happy path + Phase B ~150s + slack
    # for one retry on a failing phase (retry costs 300s + 10s sleep).
    # Previously 15 min was tight after bumping SLICES 4 → 8.
    timeout-minutes: 25
    steps:
      - name: Ping /api/cron/daily (4 slices sequentially)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret not set — add it in Settings → Secrets and variables → Actions"
            exit 1
          fi
          # Vercel Hobby caps function timeout at 300s. Bundling the
          # global sector-universe refresh (~150s) with per-entity work
          # (~150s) in slice 0 busts the cap. Split into two phases:
          #   Phase A: 4 slices of per-entity work (each ~75s).
          #   Phase B: dedicated sectorsOnly=1 call (~150s) that
          #            only screens Yahoo for sector top-N and commits
          #            newly-added entities to the registry.
          # Both phases inside 300s each. If either fails, the workflow
          # goes red at the end but successful phases still committed.
          # Iteration history: 4 → 8 → 16. SLICES=8 was still tight
          # against the 300s Vercel cap when Yahoo latency spiked.
          # Slice 0 workload at SLICES=16:
          #   reconstitute-from-shards      ~15s (cold; cache-hit is 0)
          #   news fanout                    ~10s
          #   per-entity Yahoo (~90 tickers) ~40s (serial, ~450ms each)
          #   SEC-submissions loop           ~15s
          #   SEC-verbatim reconciliation    ~10s
          #   mutateEarnings commit          ~10s
          #   Total                          ~100s (66% headroom under 300s)
          # Trade-off: 17 sequential phases at ~60s avg = ~17 min wall
          # time, inside the 25-min Actions job budget with retry slack.
          SLICES=16
          FAILED=0

          # Rate-limit-aware retry. Handles three failure modes:
          #   - 429 (store degraded / GH rate-limited): ABORT THE RUN
          #     entirely. Retrying while quota is exhausted burns more
          #     attempts and corrupts fixture-fallback state. Reset is
          #     ~50 min away — better to fail the whole workflow now,
          #     let the schedule pick it up tomorrow, or manual re-run.
          #   - 5xx (transient timeout / cold-start): retry once after
          #     30s (longer than the 10s of earlier design — a 504 on
          #     slice 0 needs Vercel to fully release the killed
          #     function before the retry, which is closer to 30s).
          #   - 4xx other (401/400): don't retry, config problem.
          # The wrapper returns a special exit code 42 on 429 so the
          # outer loop can `exit 1` the whole workflow immediately
          # rather than plow through slices 1..15 with the same result.
          run_with_retry() {
            local url="$1"
            local label="$2"
            local attempt
            for attempt in 1 2; do
              echo "  attempt $attempt ($(date -u +%H:%M:%SZ))"
              HTTP_STATUS=$(curl -s -o /tmp/cron-response.json -w '%{http_code}' \
                --max-time 310 \
                -X POST \
                -H "Authorization: Bearer $CRON_SECRET" \
                -H "Content-Type: application/json" \
                "$url")
              echo "    HTTP $HTTP_STATUS"
              if [ "$HTTP_STATUS" -eq 200 ]; then
                node -e "
                  const j = JSON.parse(require('fs').readFileSync('/tmp/cron-response.json','utf8'));
                  const eng = (j.summary?.engines ?? j.engines ?? []).map(e => e.engine + ':' + e.itemsFound).join(' ');
                  const app = j.summary?.totalAppended ?? j.totalAppended ?? 0;
                  const mat = j.summary?.totalMatured ?? j.totalMatured ?? 0;
                  console.log('    ok · appended=' + app + ' · matured=' + mat + ' · engines[' + eng + ']');
                "
                return 0
              fi
              head -c 400 /tmp/cron-response.json || true
              echo
              # 429 = the route detected fixture fallback (GH rate limit
              # exhausted). Abort — retries will only make it worse.
              if [ "$HTTP_STATUS" -eq 429 ]; then return 42; fi
              # 4xx = config error (401/400/etc.) — retry won't help.
              if [ "$HTTP_STATUS" -lt 500 ]; then return 1; fi
              sleep 30
            done
            return 1
          }

          # Phase A — per-entity work in 4 slices, sector refresh
          # disabled. Each slice processes ~1/4 of the ticker universe
          # (~375 tickers) and finishes in ~60-90s.
          for ((n=0; n<SLICES; n++)); do
            echo "== phase A · slice $n/$SLICES =="
            set +e
            run_with_retry \
              "https://earnings-karlis123.vercel.app/api/cron/daily?slice=$n&sliceCount=$SLICES&refreshSectors=0" \
              "phase A slice $n"
            rc=$?
            set -e
            if [ "$rc" -eq 42 ]; then
              # 429 from the guardrail — GH_PAT rate limit is exhausted
              # or Vercel is falling back to fixture data. Bail on the
              # whole run rather than push slices 1..N against a
              # degraded store.
              echo "::error::phase A slice $n aborted the run (429 · store degraded / GH rate-limit)"
              echo "::error::Not retrying — wait for the hourly reset, then re-trigger the workflow manually."
              FAILED=$((FAILED+1))
              exit 1
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::phase A slice $n failed after retry (final HTTP $HTTP_STATUS)"
              FAILED=$((FAILED+1))
            fi
          done

          # Phase B — sector-universe refresh (screens Yahoo for top-N
          # per sector, ~150s). No per-entity work, so it fits in one
          # 300s Vercel invocation.
          echo "== phase B · sectors-only =="
          set +e
          run_with_retry \
            "https://earnings-karlis123.vercel.app/api/cron/daily?sectorsOnly=1&refreshSectors=1" \
            "phase B"
          rc=$?
          set -e
          if [ "$rc" -eq 42 ]; then
            echo "::error::phase B aborted the run (429 · store degraded / GH rate-limit)"
            FAILED=$((FAILED+1))
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::sectors-only phase failed after retry (final HTTP $HTTP_STATUS)"
            FAILED=$((FAILED+1))
          fi

          echo "== done · $((SLICES+1-FAILED))/$((SLICES+1)) phases succeeded =="
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED phase(s) failed"
            exit 1
          fi
