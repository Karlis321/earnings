name: framework-screen

# Feature 4A/4B — Blue Ocean + Rule Breaker framework screens over
# the ~1,000-ticker operating universe. Cadence: monthly (1st of
# each month, 12:00 UTC). Self-chains via repository_dispatch so a
# multi-day grind survives the 6h GitHub Actions job cap.
#
# Chain sequence per invocation:
#   1. pick-screen-tickers.mjs emits the next batch (default 8 tickers).
#   2. If batch is empty → skip cleanly (universe complete for the
#      current 45-day threshold).
#   3. Otherwise, Claude runs the framework's rubric on the batch and
#      writes data/screens/<framework>.json via apply-screen.mjs.
#   4. After the commit, workflow dispatches itself with the SAME
#      framework input so the next batch runs on the next available
#      GH Actions slot (not the same 6h job — self-chain keeps each
#      run short, isolates quota drift, and survives crashes).
#
# The `.claude/commands/blue-ocean.md` + `rule-breaker.md` procedures
# handle the framework switch. The pool naturally stops when either
# (a) pick-screen-tickers emits empty, or (b) monthly cadence trigger
# schedules the next run.

on:
  schedule:
    # 1st of each month, 12:00 UTC → kicks off blue-ocean.
    # 2nd of each month, 12:00 UTC → kicks off rule-breaker.
    # Alternating days so the two frameworks don't fight for quota
    # on the same day.
    - cron: "0 12 1 * *"
    - cron: "0 12 2 * *"
  repository_dispatch:
    types: [framework-screen-chain]
  workflow_dispatch:
    inputs:
      framework:
        # LLM-narrative frameworks only. QARV (Phase 4.4) is mechanical
        # and doesn't need the Claude sub-agent + chain step — refresh
        # it via `node scripts/run-qarv-screen.mjs` or the
        # refresh-universe `qarv` phase instead.
        description: "Framework to run"
        type: choice
        options:
          - blue-ocean
          - rule-breaker
        required: true
        default: blue-ocean
      batch_size:
        description: "Tickers per chain step (default 8)"
        required: false
        default: "8"
      chain:
        description: "Auto-chain to next batch after commit"
        type: boolean
        required: false
        default: true

concurrency:
  # One framework at a time — different frameworks can run in
  # parallel (blue-ocean-* vs rule-breaker-*).
  group: >-
    framework-screen-${{
      github.event.inputs.framework
      || github.event.client_payload.framework
      || (github.event_name == 'schedule' && github.event.schedule == '0 12 2 * *' && 'rule-breaker')
      || 'blue-ocean'
    }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

run-name: >-
  framework-screen · ${{
    github.event.inputs.framework
    || github.event.client_payload.framework
    || (github.event_name == 'schedule' && github.event.schedule == '0 12 2 * *' && 'rule-breaker')
    || 'blue-ocean'
  }} · ${{
    github.event_name == 'schedule' && 'scheduled'
    || github.event_name == 'repository_dispatch' && 'chain'
    || 'manual'
  }}

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20

      - name: Configure git identity
        run: |
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"

      - name: Snapshot origin baseline
        id: snapshot
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "baseline SHA recorded: $SHA"

      - name: Resolve framework
        id: framework
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 12 2 * *" ]; then
              FW="rule-breaker"
            else
              FW="blue-ocean"
            fi
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            FW="${{ github.event.client_payload.framework }}"
          else
            FW="${{ github.event.inputs.framework }}"
          fi
          [ -z "$FW" ] && FW="blue-ocean"
          echo "framework=$FW" >> "$GITHUB_OUTPUT"
          BS="${{ github.event.inputs.batch_size || github.event.client_payload.batch_size || '8' }}"
          echo "batch_size=$BS" >> "$GITHUB_OUTPUT"
          echo "resolved: framework=$FW batch_size=$BS"

      - name: Pick next batch
        id: pick
        run: |
          FW="${{ steps.framework.outputs.framework }}"
          BS="${{ steps.framework.outputs.batch_size }}"
          BATCH=$(node scripts/pick-screen-tickers.mjs "$FW" --limit "$BS" --verbose 2>&1 1>/tmp/tickers.txt || true)
          echo "$BATCH"
          COUNT=$(wc -l < /tmp/tickers.txt | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "::notice::pick-screen-tickers emitted 0 tickers — universe complete for $FW at the 45-day threshold. Skipping."
          else
            TICKERS=$(paste -sd "," /tmp/tickers.txt)
            echo "empty=false" >> "$GITHUB_OUTPUT"
            echo "tickers=$TICKERS" >> "$GITHUB_OUTPUT"
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Build prompt
        id: prompt
        if: steps.pick.outputs.empty == 'false'
        run: |
          FW="${{ steps.framework.outputs.framework }}"
          TICKERS="${{ steps.pick.outputs.tickers }}"
          NARRATION="Narrate as you work: before every tool call, print one line stating what you are about to do and why. After each numbered step, print STEP <n> DONE: <one-line result>."
          RESULT_LINE="Your final message MUST be exactly one of: 'RESULT: committed data/screens/${FW}.json (<N> tickers)' or 'RESULT: skipped — <reason>'."
          NOPUSH_LINE="After committing, run 'git push origin main' as your last step. If rejected as non-fast-forward, do git fetch + git pull --rebase + retry. NEVER run 'git init', 'git reset --hard', 'git rebase --root', 'git push --force', 'git push -f'."
          echo "text=Run the /${FW} procedure in .claude/commands/${FW}.md against this batch of tickers: ${TICKERS}. Follow the procedure exactly, including the sanctioned apply-screen.mjs write. Commit and push the result. $NARRATION $RESULT_LINE $NOPUSH_LINE" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        if: steps.pick.outputs.empty == 'false'
        uses: anthropics/claude-code-action@v1
        env:
          EDGAR_CONTACT_EMAIL: ${{ vars.EDGAR_CONTACT_EMAIL || 'klpp@bluorbank.lv' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          show_full_output: true
          # Standard git allowlist — identical to week-ahead.yml + sector-ideas.yml.
          claude_args: >-
            --max-turns 200 --allowedTools
            "Bash(node scripts/*)"
            "Bash(git add *)"
            "Bash(git commit *)"
            "Bash(git status)"
            "Bash(git status *)"
            "Bash(git log *)"
            "Bash(git diff *)"
            "Bash(git show *)"
            "Bash(git rev-parse *)"
            "Bash(git fetch *)"
            "Bash(git pull)"
            "Bash(git pull --rebase)"
            "Bash(git pull --rebase *)"
            "Bash(git pull origin *)"
            "Bash(git rebase origin/*)"
            "Bash(git rebase --abort)"
            "Bash(git rebase --continue)"
            "Bash(git rebase --skip)"
            "Bash(git push)"
            "Bash(git push origin main)"
            "Bash(git push origin HEAD)"
            "Bash(git push -u origin main)"
            "Bash(ls *)"
            "Bash(grep *)"
            Read Write Edit WebSearch WebFetch

      - name: Verify commit ancestry (orphan tripwire)
        if: always()
        run: |
          BASELINE="${{ steps.snapshot.outputs.sha }}"
          if [ -z "$BASELINE" ]; then
            echo "no baseline recorded — skipping ancestry check"
            exit 0
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" = "$BASELINE" ]; then
            echo "HEAD unchanged from baseline — nothing to verify"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$BASELINE" HEAD; then
            echo "::error::ORPHAN TRIPWIRE FIRED — HEAD ($HEAD_SHA) does not descend from pre-run baseline ($BASELINE)."
            git log HEAD --format="%h · parents:%p · %s" -3
            exit 1
          fi
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "::error::ORPHAN TRIPWIRE FIRED — HEAD ($HEAD_SHA) has no parent commit."
            exit 1
          fi
          echo "✓ ancestry verified — HEAD $HEAD_SHA descends from $BASELINE"

      # Self-chain: dispatch the next batch on the SAME framework
      # unless (a) the pick step emitted empty (universe complete) or
      # (b) the manual dispatch set chain=false.
      - name: Chain to next batch
        if: >-
          steps.pick.outputs.empty == 'false' &&
          (github.event.inputs.chain != 'false')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FW="${{ steps.framework.outputs.framework }}"
          BS="${{ steps.framework.outputs.batch_size }}"
          # 2-minute quiet gap so consecutive runs don't collide on
          # rate-limit windows / GH Actions quota.
          sleep 120
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type="framework-screen-chain" \
            -f "client_payload[framework]=$FW" \
            -f "client_payload[batch_size]=$BS"
          echo "✓ chained next batch of $FW"

      - name: Report outcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FW="${{ steps.framework.outputs.framework }}"
          NEW=$(gh api "repos/${{ github.repository }}/commits?path=data/screens/${FW}.json&since=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" --jq 'length')
          if [ "$NEW" -gt 0 ]; then
            echo "✓ ${FW}.json commit landed in the last 30 minutes."
          else
            echo "ℹ️ No commit landed — Claude either skipped this batch or the universe is fully screened for $FW."
          fi
