name: sec-catchup

# Mid-day SEC catch-up for companies that report between the last
# overnight refresh and the next one.
#
# The main refresh-data workflow fires Sun-Thu 23:00 UTC. A company
# that reports at 14:00 UTC Wednesday would sit undetected in our
# shard from Wed 23:00 UTC (previous overnight, before they reported)
# through Thu 23:00 UTC — up to 29 hours of latency for the
# "did they report yet?" signal.
#
# This workflow narrows that gap to ≤ ~5 hours by hitting the SEC
# catch-up phases twice per day mid-cycle. It only runs the audit
# + promote pair (fast — ~40s SEC audit + 0.1s promote + shard
# rebuild) — no Yahoo timeseries, no reactions, no signal-layer
# regeneration. Overnight refresh remains the source-of-truth pass.

on:
  schedule:
    # 13:30 UTC — after typical BMO (before market open) reports.
    # US BMO reports land 12:00-13:00 UTC; we run just after so a
    # 12:15 UTC filing is caught in the same window.
    - cron: "30 13 * * 1-5"
    # 17:30 UTC — after typical mid-day / lunch reports and the
    # first wave of AMC (after market close) reports. AMC reports
    # start landing 20:00 UTC so this catches earlier movers.
    # cron-nudge: 2026-08-29 (initial commit).
    - cron: "30 17 * * 1-5"
  workflow_dispatch:
    inputs:
      note:
        description: "Trigger source label (shown in the run title)."
        required: false
        default: ""

concurrency:
  group: sec-catchup
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Configure git identity
        run: |
          git config user.name  "sec-catchup-bot"
          git config user.email "sec-catchup-bot@users.noreply.github.com"

      - name: Audit stale upcoming shells
        env:
          EDGAR_CONTACT_EMAIL: ${{ vars.EDGAR_CONTACT_EMAIL || 'klpp@bluorbank.lv' }}
        run: |
          set -euo pipefail
          node scripts/audits/audit-stale-upcoming-shells.mjs

      - name: Promote stale shells
        run: |
          set -euo pipefail
          node scripts/backfills/promote-stale-upcoming-shells.mjs

      - name: SEC-verbatim rederive scoped to just-promoted CIKs
        # Fills metrics on the freshly-promoted events so
        # sp500_complete_pct stays above its 95% floor. Full-universe
        # rederive would take ~30 min; scoped by --cik takes ~5s per
        # CIK. Skips gracefully when nothing was promoted.
        env:
          EDGAR_CONTACT_EMAIL: ${{ vars.EDGAR_CONTACT_EMAIL || 'klpp@bluorbank.lv' }}
        run: |
          set -euo pipefail
          CIKS=$(node -e "
            const a = require('./scripts/audits/promote-stale-upcoming-shells.json');
            const promoted = a.promoted || [];
            if (promoted.length === 0) { process.exit(0); }
            const reg = require('./data/entity-registry.json').entities;
            const byT = new Map(reg.map(e => [e.ticker, e]));
            const ciks = new Set();
            for (const p of promoted) {
              const ent = byT.get(p.ticker);
              if (ent && ent.edgarCik) ciks.add(String(parseInt(ent.edgarCik, 10)));
            }
            process.stdout.write([...ciks].join(','));
          ")
          if [ -z "$CIKS" ]; then
            echo "no CIKs promoted this run — skipping scoped sec-verbatim"
            exit 0
          fi
          echo "running rederive-sec-xbrl on $(echo $CIKS | tr ',' '\n' | wc -l) CIKs"
          node scripts/backfills/rederive-sec-xbrl.mjs --cik="$CIKS"

      - name: Rebuild events-index + shards summary
        run: |
          set -euo pipefail
          node scripts/shard-earnings.mjs

      - name: Refresh ranking
        # Cheap (~0.5s) and keeps /ideas in sync with just-promoted
        # events; skips gracefully if run-ranking.mjs errors.
        continue-on-error: true
        run: node scripts/run-ranking.mjs

      - name: Commit + push (only if shards changed)
        run: |
          set -euo pipefail
          # Include any shard changes + audit trail + index + ranking.
          git add -A data/events/ data/events-index.json data/ranking.json \
                     scripts/audits/stale-upcoming-shells.json \
                     scripts/audits/promote-stale-upcoming-shells.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to commit — no stale shells promoted this run"
            exit 0
          fi
          # Count promoted rows for the commit subject.
          COUNT=$(node -e "const a=require('./scripts/audits/promote-stale-upcoming-shells.json'); console.log(a.totals.promoted||0)")
          if [ "$COUNT" = "0" ]; then
            echo "audit + rebuild ran but promoted 0 events — skipping commit"
            git reset HEAD -- .
            exit 0
          fi
          # Rebase before pushing — mid-day catch-up commonly collides
          # with the /sweep workflow or manual pushes. Prefer OURS on
          # shard files (we just verified against SEC).
          git commit -m "sec-catchup: promoted $COUNT stale upcoming shells

Auto-run of the audit + promote pair to catch US-CIK entities
whose 10-Q/10-K landed at SEC since the overnight refresh."
          git fetch origin main
          if ! git rebase -X ours origin/main; then
            echo "::warning::rebase conflict — aborting"
            git rebase --abort || true
            exit 1
          fi
          git push
