name: sec-catchup

# Mid-day SEC catch-up for companies that report between the last
# overnight refresh and the next one.
#
# The main refresh-data workflow fires Sun-Thu 23:00 UTC. A company
# that reports at 14:00 UTC Wednesday would sit undetected in our
# shard from Wed 23:00 UTC (previous overnight, before they reported)
# through Thu 23:00 UTC — up to 29 hours of latency for the
# "did they report yet?" signal.
#
# This workflow narrows that gap to ≤ ~5 hours by hitting the SEC
# catch-up phases twice per day mid-cycle. It only runs the audit
# + promote pair (fast — ~40s SEC audit + 0.1s promote + shard
# rebuild) — no Yahoo timeseries, no reactions, no signal-layer
# regeneration. Overnight refresh remains the source-of-truth pass.

on:
  schedule:
    # 13:30 UTC — after typical BMO (before market open) reports.
    - cron: "30 13 * * 1-5"
    # 17:30 UTC — after typical mid-day / lunch reports and the
    # first wave of AMC (after market close) reports.
    - cron: "30 17 * * 1-5"
  workflow_dispatch:
    inputs:
      note:
        description: "Trigger source label (shown in the run title)."
        required: false
        default: ""

concurrency:
  group: sec-catchup
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Persist credentials so `git push` at the end works with
          # the auto-provisioned GITHUB_TOKEN.
          persist-credentials: true

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Configure git identity
        run: |
          git config user.name  "sec-catchup-bot"
          git config user.email "sec-catchup-bot@users.noreply.github.com"
          echo "STEP · configure-git · OK"
          echo "## sec-catchup diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| step | outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| checkout | ok |" >> "$GITHUB_STEP_SUMMARY"
          echo "| setup-node | ok |" >> "$GITHUB_STEP_SUMMARY"
          echo "| configure-git | ok |" >> "$GITHUB_STEP_SUMMARY"

      - name: Audit stale upcoming shells
        env:
          EDGAR_CONTACT_EMAIL: ${{ vars.EDGAR_CONTACT_EMAIL || 'klpp@bluorbank.lv' }}
        run: |
          set -eo pipefail
          echo "STEP · audit · START"
          node scripts/audits/audit-stale-upcoming-shells.mjs || {
            RC=$?
            echo "| audit | **FAIL exit=$RC** |" >> "$GITHUB_STEP_SUMMARY"
            exit $RC
          }
          STALE=$(node -e "try { const a = require('./scripts/audits/stale-upcoming-shells.json'); console.log((a.stale||[]).length); } catch { console.log('?'); }")
          echo "| audit | ok · $STALE stale shells found |" >> "$GITHUB_STEP_SUMMARY"
          echo "STEP · audit · OK"

      - name: Early exit if nothing to promote
        id: early-exit
        run: |
          set -eo pipefail
          echo "STEP · early-exit-check · START"
          if [ ! -f scripts/audits/stale-upcoming-shells.json ]; then
            echo "no audit file — nothing to do"
            echo "empty=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          COUNT=$(node -e "
            try {
              const a = require('./scripts/audits/stale-upcoming-shells.json');
              console.log((a.stale || []).length);
            } catch (e) { console.log('0'); }
          ")
          echo "audit found $COUNT stale shells"
          if [ "$COUNT" = "0" ]; then
            echo "empty=true" >> $GITHUB_OUTPUT
          else
            echo "empty=false" >> $GITHUB_OUTPUT
          fi
          echo "STEP · early-exit-check · OK · empty=$([ \"$COUNT\" = \"0\" ] && echo yes || echo no)"

      - name: Promote stale shells
        if: steps.early-exit.outputs.empty != 'true'
        run: |
          set -eo pipefail
          echo "STEP · promote · START"
          node scripts/backfills/promote-stale-upcoming-shells.mjs || {
            RC=$?
            echo "| promote | **FAIL exit=$RC** |" >> "$GITHUB_STEP_SUMMARY"
            exit $RC
          }
          PROMOTED=$(node -e "try { const a = require('./scripts/audits/promote-stale-upcoming-shells.json'); console.log(a.totals && a.totals.promoted || 0); } catch { console.log('?'); }")
          echo "| promote | ok · $PROMOTED events promoted |" >> "$GITHUB_STEP_SUMMARY"
          echo "STEP · promote · OK"

      - name: SEC-verbatim rederive scoped to just-promoted CIKs
        if: steps.early-exit.outputs.empty != 'true'
        env:
          EDGAR_CONTACT_EMAIL: ${{ vars.EDGAR_CONTACT_EMAIL || 'klpp@bluorbank.lv' }}
        run: |
          set -eo pipefail
          echo "STEP · scoped-rederive · START"
          if [ ! -f scripts/audits/promote-stale-upcoming-shells.json ]; then
            echo "no promote audit file — nothing to rederive"
            exit 0
          fi
          CIKS=$(node -e '
            try {
              const a = require("./scripts/audits/promote-stale-upcoming-shells.json");
              const promoted = a.promoted || [];
              if (promoted.length === 0) { process.exit(0); }
              const reg = require("./data/entity-registry.json").entities;
              const byT = new Map(reg.map(e => [e.ticker, e]));
              const ciks = new Set();
              for (const p of promoted) {
                const ent = byT.get(p.ticker);
                if (ent && ent.edgarCik) ciks.add(String(parseInt(ent.edgarCik, 10)));
              }
              process.stdout.write([...ciks].join(","));
            } catch (e) { process.exit(0); }
          ') || CIKS=""
          if [ -z "$CIKS" ]; then
            echo "no CIKs to rederive — skipping"
            exit 0
          fi
          NCIKS=$(echo "$CIKS" | tr ',' '\n' | wc -l)
          echo "running rederive-sec-xbrl on $NCIKS CIKs"
          node scripts/backfills/rederive-sec-xbrl.mjs --cik="$CIKS" || {
            RC=$?
            echo "| scoped-rederive | **FAIL exit=$RC (nciks=$NCIKS)** |" >> "$GITHUB_STEP_SUMMARY"
            exit $RC
          }
          echo "| scoped-rederive | ok · $NCIKS CIKs |" >> "$GITHUB_STEP_SUMMARY"
          echo "STEP · scoped-rederive · OK"

      - name: Rebuild events-index
        if: steps.early-exit.outputs.empty != 'true'
        run: |
          set -eo pipefail
          echo "STEP · rebuild · START"
          node scripts/shard-earnings.mjs || {
            RC=$?
            echo "| rebuild | **FAIL exit=$RC** |" >> "$GITHUB_STEP_SUMMARY"
            exit $RC
          }
          echo "| rebuild | ok |" >> "$GITHUB_STEP_SUMMARY"
          echo "STEP · rebuild · OK"

      - name: Refresh ranking
        if: steps.early-exit.outputs.empty != 'true'
        continue-on-error: true
        run: |
          set -eo pipefail
          echo "STEP · rerank · START"
          node scripts/run-ranking.mjs && echo "| rerank | ok |" >> "$GITHUB_STEP_SUMMARY" || echo "| rerank | skipped (non-fatal) |" >> "$GITHUB_STEP_SUMMARY"
          echo "STEP · rerank · OK"

      - name: Commit + push if anything changed
        if: steps.early-exit.outputs.empty != 'true'
        run: |
          set -eo pipefail
          echo "STEP · commit-push · START"
          # Stage only known-safe paths. `--` guards against pathspec
          # collision on paths that don't exist yet.
          git add -- data/events/ data/events-index.json data/ranking.json 2>/dev/null || true
          git add -- scripts/audits/stale-upcoming-shells.json 2>/dev/null || true
          git add -- scripts/audits/promote-stale-upcoming-shells.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no staged changes — skipping commit"
            echo "STEP · commit-push · OK (no-op)"
            exit 0
          fi
          COUNT=$(node -e "
            try {
              const a = require('./scripts/audits/promote-stale-upcoming-shells.json');
              console.log(a.totals && a.totals.promoted || 0);
            } catch (e) { console.log(0); }
          ")
          if [ "$COUNT" = "0" ]; then
            echo "0 promoted — skipping commit"
            git reset -- . || true
            echo "STEP · commit-push · OK (no-op · 0 promoted)"
            exit 0
          fi
          git commit -m "sec-catchup: promoted $COUNT stale upcoming shells" || {
            echo "| commit-push | **FAIL: git commit failed** |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          # Push with retry: if origin moved during our ~4-min run,
          # re-fetch, cherry-pick our commit onto latest origin/main,
          # and push again. Avoid `git rebase -X ours` because the
          # ours strategy doesn't handle every conflict shape (the
          # 2026-08-31 sec-catchup #37 hit an unresolvable rebase
          # conflict against a concurrent sweep push).
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            git fetch origin main || {
              echo "| commit-push | **FAIL: fetch attempt $attempt** |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }
            if git push 2>/tmp/push.err; then
              echo "| commit-push | ok · pushed $COUNT-shell commit (attempt $attempt) |" >> "$GITHUB_STEP_SUMMARY"
              echo "STEP · commit-push · OK · pushed $COUNT-shell commit"
              exit 0
            fi
            echo "push attempt $attempt failed:"
            cat /tmp/push.err
            # Non-fast-forward → cherry-pick onto latest origin/main.
            SHA=$(git rev-parse HEAD)
            git reset --hard origin/main
            if git cherry-pick "$SHA"; then
              continue
            fi
            # Cherry-pick conflict — the promoted shells collide with
            # a concurrent commit. Auto-resolve by preferring OUR
            # (the sec-catchup pass has authoritative SEC data).
            git checkout --ours -- data/events/ data/events-index.json data/ranking.json \
              scripts/audits/stale-upcoming-shells.json \
              scripts/audits/promote-stale-upcoming-shells.json 2>/dev/null || true
            git add -A
            if ! git -c core.editor=true cherry-pick --continue; then
              git cherry-pick --abort || true
              echo "| commit-push | **FAIL: cherry-pick conflict on attempt $attempt** |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "| commit-push | **FAIL: exhausted $MAX_ATTEMPTS push attempts** |" >> "$GITHUB_STEP_SUMMARY"
          exit 1
