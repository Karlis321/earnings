name: claude-summarize
on:
  repository_dispatch:
    types: [summarize]
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker to summarize (blank = sweep)"
        required: false

concurrency:
  group: claude-summarize
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Build prompt
        id: prompt
        run: |
          NARRATION="Narrate as you work: before every tool call, print one line stating what you are about to do and why (e.g. 'Searching for Hudbay Q1 2026 press release', 'Running validator', 'Committing HBM_US_FY2026_Q1'). After each numbered step of the procedure, print STEP <n> DONE: <one-line result>. Never work silently for more than one tool call."
          RESULT_LINE="Your final message MUST be exactly one of: 'RESULT: committed <filename>' or 'RESULT: skipped — <reason>'. Any other ending is a failure."
          TICKER="${{ github.event.client_payload.ticker || github.event.inputs.ticker }}"
          if [ -n "$TICKER" ]; then
            echo "text=Run the /earnings procedure in .claude/commands/earnings.md for ticker $TICKER. Follow it exactly, including validation. Commit and push the result. $NARRATION $RESULT_LINE" >> "$GITHUB_OUTPUT"
          else
            echo "text=Run the /sweep procedure in .claude/commands/sweep.md. Follow it exactly, including validation. Commit and push the result. $NARRATION $RESULT_LINE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          show_full_output: true
          max_turns: 25
          claude_args: >-
            --allowedTools "Bash(node scripts/validate.js)" "Bash(git *)" Read Write Edit WebSearch WebFetch

      - name: Verify a summary was produced or explicitly skipped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW=$(gh api "repos/${{ github.repository }}/commits?path=data/summaries&since=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" --jq 'length')
          if [ "$NEW" -eq 0 ]; then
            echo "::error::Run completed but no summary commit landed in data/summaries/"
            exit 1
          fi
          echo "Verified: $NEW summary commit(s) in the last 30 minutes."
