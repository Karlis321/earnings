name: claude-summarize
on:
  repository_dispatch:
    types: [summarize]
  schedule:
    - cron: "30 4 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker to summarize (blank = sweep)"
        required: false
      note:
        description: "Trigger source label (e.g. 'claude', 'karlis test'). Shown in the run title."
        required: false
        default: ""
      force:
        description: "Force-regenerate: bypass the 'summary already exists' guard and overwrite. Required when retrying a ticker that got kpi-only downgrade."
        required: false
        type: boolean
        default: false

# run-name — the Actions-tab title per run. Shows /earnings vs /sweep,
# trigger source, and any note so a scan of the tab reads at a glance.
run-name: >-
  claude-summarize · ${{
    (github.event.inputs.ticker != '' && format('/earnings {0}', github.event.inputs.ticker))
    || (github.event.client_payload.ticker != null && format('/earnings {0} (button)', github.event.client_payload.ticker))
    || '/sweep'
  }} · ${{
    github.event_name == 'schedule' && 'scheduled (04:30 UTC)'
    || github.event_name == 'repository_dispatch' && 'button'
    || (github.event.inputs.note != '' && format('manual · {0}', github.event.inputs.note))
    || 'manual'
  }}

# Per-ticker concurrency instead of a single global group. Effect:
#
#   - Different tickers run in PARALLEL (bounded only by GitHub's
#     concurrent-job cap on your plan, ~20 for personal accounts).
#   - Same-ticker retries still serialize (identical group name).
#   - /sweep is its own group ("sweep") so it doesn't block per-
#     ticker dispatches and vice versa.
#
# Previously: `group: claude-summarize` → strict 1-at-a-time. Every
# ticker queued behind the last, giving ~15 min-per-ticker effective
# throughput. With per-ticker groups + ~20-way parallelism, effective
# throughput is ~20x on a busy batch (main bottleneck moves to
# Yahoo/SEC rate limits, not GH scheduling).
concurrency:
  group: >-
    claude-summarize-${{
      github.event.inputs.ticker != '' && github.event.inputs.ticker
      || github.event.client_payload.ticker != null && github.event.client_payload.ticker
      || 'sweep'
    }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 20 (bumped from 1) so git rebase / git log
          # against origin/main can succeed. The Aug 18 orphan incident
          # traced to Claude hitting a non-fast-forward push, trying
          # `git pull --rebase` against a shallow clone, failing due to
          # missing parent commits, and escalating to `git init` +
          # force-push. 20 commits gives enough headroom for any
          # concurrent-push race without inflating clone time.
          fetch-depth: 20

      # Configure git identity BEFORE Claude runs so it never has to
      # `git config` itself — that was one of the escalation paths in
      # the orphan incident. The `claude[bot]` identity matches what
      # /earnings + /sweep commits carry historically.
      - name: Configure git identity
        run: |
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"

      # Snapshot the origin/main tip BEFORE Claude runs. The post-Claude
      # tripwire compares HEAD's ancestry against this SHA to detect
      # orphan-tip pushes.
      - name: Snapshot origin baseline
        id: snapshot
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "baseline SHA recorded: $SHA"

      - name: Build prompt
        id: prompt
        run: |
          NARRATION="Narrate as you work: before every tool call, print one line stating what you are about to do and why (e.g. 'Searching for Hudbay Q1 2026 press release', 'Running validator', 'Committing HBM_US_FY2026_Q1'). After each numbered step of the procedure, print STEP <n> DONE: <one-line result>. Never work silently for more than one tool call."
          STEP3B_REMINDER="STEP 3b IS MANDATORY. For every ticker where you compose a summary, you MUST also call scripts/apply-extended-metrics.mjs with the sector-specific KPIs extracted from the same filing. Skipping 3b is a task failure — even an empty extendedMetrics array is acceptable, but the script call is not. Refer to frontend/lib/extendedMetricsRegistry.ts for the per-sector priority set."
          EXHIBIT_REMINDER="If Step 1's sourceLink.url is an SEC 8-K cover document (short filename with issuer ticker + date under an accession folder, e.g. aapl-20260730.htm), FIRST call scripts/resolve-edgar-exhibit.mjs <url> to get the EX-99.1 press-release exhibit URL, THEN fetch-edgar the exhibit. Fetching the 8-K cover directly wastes the fetch budget on a stub that only points at the exhibit — this defeated AAPL's Step 3b in the previous batch."
          RESULT_LINE="Your final message MUST be exactly one of: 'RESULT: committed <filename>' or 'RESULT: skipped — <reason>'. Any other ending is a failure."
          NOPUSH_LINE="IMPORTANT: DO NOT run \`git push\`. Commit your changes locally with \`git add\` + \`git commit\`, then STOP. The workflow's post-Claude ancestry-verification step will push your commit for you after checking it descends from origin/main. If your \`git push\` is rejected as 'command not allowed', that is EXPECTED — treat commit success as task completion. Never try to recover from a push rejection with rebase / reset / init — those produced the Aug 18 orphan incident."
          TICKER="${{ github.event.client_payload.ticker || github.event.inputs.ticker }}"
          # `force` comes from /api/summarize when the user clicked
          # "Regenerate" on an existing summary. Instructs /earnings
          # to bypass the "summary already exists" guard and rewrite.
          # `force` comes from either the API-side repository_dispatch
          # (client_payload.force from /api/summarize) OR from a manual
          # workflow_dispatch input (Actions UI checkbox). Either fires
          # the /earnings Step-0 bypass.
          FORCE="${{ github.event.client_payload.force || github.event.inputs.force }}"
          FORCE_LINE=""
          if [ "$FORCE" = "true" ]; then
            FORCE_LINE=" IMPORTANT: force-regenerate mode. Skip the Step-0 'summary already exists' guard and produce a fresh summary, OVERWRITING the existing file on disk. Confidence-notes MUST mention this is a regeneration."
          fi
          if [ -n "$TICKER" ]; then
            echo "text=Run the /earnings procedure in .claude/commands/earnings.md for ticker $TICKER. Follow it exactly, including validation. Commit the result (do not push).$FORCE_LINE $STEP3B_REMINDER $EXHIBIT_REMINDER $NARRATION $RESULT_LINE $NOPUSH_LINE" >> "$GITHUB_OUTPUT"
          else
            echo "text=Run the /sweep procedure in .claude/commands/sweep.md. Follow it exactly, including validation. Commit the result (do not push). $STEP3B_REMINDER $EXHIBIT_REMINDER $NARRATION $RESULT_LINE $NOPUSH_LINE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          EDGAR_CONTACT_EMAIL: ${{ vars.EDGAR_CONTACT_EMAIL || 'klpp@bluorbank.lv' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          show_full_output: true
          # git allowlist: EXPLICIT safe subcommands only. Previously
          # `Bash(git *)` matched anything including `git init`,
          # `git reset --hard`, `git rebase --root`, `git push --force`
          # — those are how the Aug 18 orphan happened. Now Claude can
          # add / commit / read / fetch / pull, but NOT init, reset,
          # rebase, checkout --, clean, filter-*, worktree, update-ref,
          # gc, prune, or force-push. Push is limited to the exact
          # `git push origin main` form so `--force` cannot be tacked on.
          claude_args: >-
            --max-turns 300 --allowedTools
            "Bash(node scripts/*)"
            "Bash(node scripts/backfills/*)"
            "Bash(node scripts/dev-tests/*)"
            "Bash(git add *)"
            "Bash(git commit *)"
            "Bash(git status *)"
            "Bash(git log *)"
            "Bash(git diff *)"
            "Bash(git show *)"
            "Bash(git rev-parse *)"
            "Bash(git fetch *)"
            "Bash(ls *)"
            "Bash(grep *)"
            Read Write Edit WebSearch WebFetch

      # Orphan-commit tripwire. After the Aug 18 incident where a
      # Claude run pushed a parent-less commit that wiped 1400+ commits
      # of history, we verify the pushed commit's parent chain matches
      # the pre-run origin/main baseline. Any deviation (orphan tip,
      # or HEAD that doesn't descend from origin/main^) fails the
      # workflow and — critically — leaves the incident visible on the
      # Actions tab instead of silent-in-the-git-log.
      #
      # We snapshot origin/main SHA before Claude runs (see the
      # "Snapshot origin baseline" step) and compare after. If Claude's
      # HEAD lost the ancestry, we bail LOUD.
      #
      # A future push-race that pushes on top of the orphan will still
      # succeed here (HEAD descends from the orphan which descends from
      # nothing) — that's a Vercel/gh side detection concern. The
      # tripwire's job is to prevent THIS runner from being the one
      # that publishes an orphan.
      - name: Verify commit ancestry (orphan tripwire)
        if: always()
        run: |
          # If Claude didn't produce a new commit (e.g. RESULT: skipped),
          # HEAD is unchanged from checkout; nothing to verify.
          BASELINE="${{ steps.snapshot.outputs.sha }}"
          if [ -z "$BASELINE" ]; then
            echo "no baseline recorded — skipping ancestry check"
            exit 0
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" = "$BASELINE" ]; then
            echo "HEAD unchanged from baseline — nothing to verify"
            exit 0
          fi
          # HEAD must descend from BASELINE (i.e., BASELINE is reachable
          # from HEAD via parent walk). `git merge-base --is-ancestor`
          # returns 0 when true, 1 when false.
          if ! git merge-base --is-ancestor "$BASELINE" HEAD; then
            echo "::error::ORPHAN TRIPWIRE FIRED — HEAD ($HEAD_SHA) does not descend from pre-run origin/main ($BASELINE)."
            echo "::error::This is exactly the failure mode of the Aug 18 orphan incident. Refusing to push."
            echo "HEAD parents:"
            git log HEAD --format="%h · parents:%p · %s" -3
            exit 1
          fi
          # Also verify HEAD itself is not an orphan (has a parent).
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "::error::ORPHAN TRIPWIRE FIRED — HEAD ($HEAD_SHA) has no parent commit."
            exit 1
          fi
          echo "✓ ancestry verified — HEAD $HEAD_SHA descends from $BASELINE"

      # After ancestry passes, THE WORKFLOW does the push — not Claude.
      # This is the second half of the orphan tripwire: Claude's git
      # allowlist has `git push` removed entirely, so any orphan tip
      # never reaches origin/main from a Claude tool call. If Claude
      # committed cleanly and ancestry verified, this step is a
      # straightforward push with no force. If the push is rejected
      # (concurrent commit landed while Claude was running), fetch +
      # rebase locally with the ours strategy on data conflicts, then
      # try once more. Never force.
      - name: Push commits (workflow-controlled)
        if: success()
        run: |
          BASELINE="${{ steps.snapshot.outputs.sha }}"
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" = "$BASELINE" ]; then
            echo "no new commit — skipping push"
            exit 0
          fi
          echo "pushing $HEAD_SHA to origin/main…"
          if git push origin main 2>&1; then
            echo "✓ push landed"
            exit 0
          fi
          echo "push rejected — attempting fetch + rebase-ours-on-data"
          git fetch origin main
          if git rebase -X ours origin/main; then
            git push origin main
          else
            git rebase --abort
            echo "::error::rebase after conflict failed — leaving local commit unpushed. Retry via workflow_dispatch after inspecting the diff."
            exit 1
          fi

      - name: Report summary outcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Informational only — don't fail the workflow on zero
          # commits. /sweep legitimately skips when no candidate has
          # reported since the last summary (most days: 0-2 commits;
          # peak earnings weeks: 10-30). Actual failures (auth token
          # revoked, action crash, prompt malformed) surface as a
          # failure on the "Run Claude Code" step itself and fail
          # the workflow there. Keep this step as a friendly log.
          NEW=$(gh api "repos/${{ github.repository }}/commits?path=data/summaries&since=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" --jq 'length')
          if [ "$NEW" -gt 0 ]; then
            echo "✓ $NEW summary commit(s) landed in the last 30 minutes."
          else
            echo "ℹ️ No summary commits landed — Claude either had no due candidates or explicitly skipped. See the Run Claude Code step output above."
          fi
