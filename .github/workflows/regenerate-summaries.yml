name: regenerate-summaries

# On-demand backfill: re-runs /earnings with force=true for every
# ticker under data/summaries/. Purpose is to populate
# event.extendedMetrics[] on the 54 tickers that got summaries earlier
# today (before Step 3b became mandatory in commit 47d78f95).
#
# Fires the /api/summarize endpoint sequentially with configurable
# delay per ticker. Uses the CRON_SECRET GitHub secret (already stored)
# — no local env setup needed. Concurrency group is INTENTIONALLY
# NOT the shared "claude-summarize" so this workflow can fire while
# runs from that group are also in flight (this workflow only makes
# API calls, it doesn't itself invoke Claude Code).

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which pool to iterate."
        required: true
        type: choice
        options:
          - summaries
          - sp500
          - r1000
          - covered
        default: sp500
      delay_seconds:
        description: "Delay per ticker in seconds. Default 900 (15 min) matches typical /earnings run duration."
        required: false
        default: "900"
      start_at:
        description: "Index to start at (0-based). Resume a partial run without re-firing already-processed tickers."
        required: false
        default: "0"
      limit:
        description: "Max tickers to process this run. Blank = all."
        required: false
        default: ""

permissions:
  contents: read
  actions: write  # required for self-chaining via `gh workflow run`

concurrency:
  group: regenerate-summaries
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 1440  # 24h — plenty for a 14h sequential batch
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Chain the NEXT batch immediately, before this batch starts its
      # ~6h work. GitHub-hosted runners have a hard 6h job limit, so
      # steps after "Fire regeneration batch" would not run when
      # cancelled. Firing the next dispatch here queues it in the
      # concurrency group (1 in-progress + 1 queued max); when this
      # batch ends (either normally or via 6h cancel), the queued one
      # starts and repeats the chain. Stops when start_at + limit
      # exceeds the SP500 pool size (491).
      - name: Chain next batch (self-perpetuating)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ github.event.inputs.source }}
          DELAY_SECONDS: ${{ github.event.inputs.delay_seconds }}
          START_AT: ${{ github.event.inputs.start_at }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          START=${START_AT:-0}
          LIM=${LIMIT:-25}
          NEXT_START=$((START + LIM))
          # Pool sizes: SP500 ~491, R1000 ~1013, summaries ~54, covered ~17.
          # Only chain if there's more work in the same pool.
          POOL_SIZE=491
          case "$SOURCE" in
            r1000) POOL_SIZE=1013 ;;
            summaries) POOL_SIZE=54 ;;
            covered) POOL_SIZE=17 ;;
          esac
          if [ "$NEXT_START" -ge "$POOL_SIZE" ]; then
            echo "chain done · next_start=$NEXT_START ≥ pool_size=$POOL_SIZE for source=$SOURCE"
            exit 0
          fi
          echo "chaining next batch · source=$SOURCE start_at=$NEXT_START limit=$LIM (pool size $POOL_SIZE)"
          gh workflow run regenerate-summaries.yml \
            --repo "${{ github.repository }}" \
            --field source="$SOURCE" \
            --field delay_seconds="$DELAY_SECONDS" \
            --field start_at="$NEXT_START" \
            --field limit="$LIM" \
            || echo "::warning::chain dispatch failed (non-fatal)"

      - name: Fire regeneration batch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SOURCE: ${{ github.event.inputs.source }}
          DELAY_MS: ${{ github.event.inputs.delay_seconds && format('{0}000', github.event.inputs.delay_seconds) || '900000' }}
          START_AT: ${{ github.event.inputs.start_at }}
          LIMIT: ${{ github.event.inputs.limit }}
          API_BASE: https://earnings-karlis123.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set on this repo"
            exit 1
          fi
          echo "Starting regeneration batch"
          echo "  DELAY_MS   = $DELAY_MS"
          echo "  START_AT   = ${START_AT:-0}"
          echo "  LIMIT      = ${LIMIT:-<all>}"
          echo "  API_BASE   = $API_BASE"
          node scripts/regenerate-summaries-batch.mjs
