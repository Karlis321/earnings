name: sector-ideas

# LLM sector synthesis — the narrative layer on top of the
# mechanical sector-signals rollup. See
# .claude/commands/sector-ideas.md for the procedure. Writes
# data/sector-ideas.json (single-file overwrite per run).
# Consumed by /themes as a panel above the mechanical grid.

on:
  # Sunday 21:00 UTC — one hour before week-ahead so any newly
  # committed themes can be referenced by the week-ahead narrative
  # if it wants to. Weekly cadence.
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      note:
        description: "Trigger source label (shown in the run title)."
        required: false
        default: ""

concurrency:
  group: sector-ideas
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

run-name: >-
  sector-ideas · ${{
    github.event_name == 'schedule' && 'scheduled (Sun 21:00 UTC)'
    || (github.event.inputs.note != '' && format('manual · {0}', github.event.inputs.note))
    || 'manual'
  }}

jobs:
  sector-ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20

      - name: Configure git identity
        run: |
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"

      - name: Snapshot origin baseline
        id: snapshot
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "baseline SHA recorded: $SHA"

      # Refresh the sector-signals snapshot before Claude runs so
      # the themes reference same-day data. Non-blocking; if it
      # fails, the /sector-ideas command's Step 0 will emit
      # "skipped — sector-signals stale/missing".
      - name: Refresh sector-signals snapshot
        continue-on-error: true
        run: node scripts/aggregate-by-sector.mjs

      - name: Build prompt
        id: prompt
        run: |
          NARRATION="Narrate as you work: before every tool call, print one line stating what you are about to do and why. After each numbered step, print STEP <n> DONE: <one-line result>."
          RESULT_LINE="Your final message MUST be exactly one of: 'RESULT: committed data/sector-ideas.json (<N> themes)' or 'RESULT: skipped — <reason>'."
          NOPUSH_LINE="IMPORTANT: after committing, you MAY run 'git push origin main'. If it is rejected as non-fast-forward, run 'git fetch origin' + 'git pull --rebase origin main' + retry the push. NEVER run 'git init', 'git reset --hard', 'git rebase --root', 'git push --force', 'git push -f'."
          echo "text=Run the /sector-ideas procedure in .claude/commands/sector-ideas.md. Follow it exactly, including the validation step and the sanctioned apply-sector-ideas.mjs write. Commit and push the result. $NARRATION $RESULT_LINE $NOPUSH_LINE" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          EDGAR_CONTACT_EMAIL: ${{ vars.EDGAR_CONTACT_EMAIL || 'klpp@bluorbank.lv' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          show_full_output: true
          # git allowlist — identical to week-ahead.yml.
          claude_args: >-
            --max-turns 80 --allowedTools
            "Bash(node scripts/*)"
            "Bash(git add *)"
            "Bash(git commit *)"
            "Bash(git status)"
            "Bash(git status *)"
            "Bash(git log *)"
            "Bash(git diff *)"
            "Bash(git show *)"
            "Bash(git rev-parse *)"
            "Bash(git fetch *)"
            "Bash(git pull)"
            "Bash(git pull --rebase)"
            "Bash(git pull --rebase *)"
            "Bash(git pull origin *)"
            "Bash(git rebase origin/*)"
            "Bash(git rebase --abort)"
            "Bash(git rebase --continue)"
            "Bash(git rebase --skip)"
            "Bash(git push)"
            "Bash(git push origin main)"
            "Bash(git push origin HEAD)"
            "Bash(git push -u origin main)"
            "Bash(ls *)"
            "Bash(grep *)"
            Read Write Edit

      # Ancestry tripwire — identical logic to week-ahead.yml.
      # Fails loud if Claude produces a HEAD that doesn't descend
      # from the pre-run baseline.
      - name: Verify commit ancestry (orphan tripwire)
        if: always()
        run: |
          BASELINE="${{ steps.snapshot.outputs.sha }}"
          if [ -z "$BASELINE" ]; then
            echo "no baseline recorded — skipping ancestry check"
            exit 0
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" = "$BASELINE" ]; then
            echo "HEAD unchanged from baseline — nothing to verify"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$BASELINE" HEAD; then
            echo "::error::ORPHAN TRIPWIRE FIRED — HEAD ($HEAD_SHA) does not descend from pre-run baseline ($BASELINE)."
            git log HEAD --format="%h · parents:%p · %s" -3
            exit 1
          fi
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "::error::ORPHAN TRIPWIRE FIRED — HEAD ($HEAD_SHA) has no parent commit."
            exit 1
          fi
          echo "✓ ancestry verified — HEAD $HEAD_SHA descends from $BASELINE"

      - name: Report outcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW=$(gh api "repos/${{ github.repository }}/commits?path=data/sector-ideas.json&since=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" --jq 'length')
          if [ "$NEW" -gt 0 ]; then
            echo "✓ sector-ideas.json commit landed in the last 30 minutes."
          else
            echo "ℹ️ No commit landed — Claude either skipped (stale/missing input) or wrote no themes. See the Run Claude Code step output above."
          fi
